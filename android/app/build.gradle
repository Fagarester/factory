apply plugin: 'com.android.application'

android {
    namespace 'com.factorynative'
    compileSdk 36

    defaultConfig {
        applicationId 'com.factorynative'
        minSdk 29
        // 29 + requestLegacyExternalStorage: the game folder is read from shared storage
        targetSdk 29
        versionCode 68
        versionName '0.68-native-test'
        ndk { abiFilters 'arm64-v8a' }
    }

    // Own release key (not the public Android debug key, which Play Protect
    // distrusts). Kept outside the repo; both build types use it so updates install over each other.
    def signing = file(System.getenv('FNATIVE_SIGNING') ?: '/root/factorio-native-keys/keystore.properties')
    if (signing.exists()) {
        def key = new Properties()
        signing.withInputStream { key.load(it) }
        signingConfigs {
            fnative {
                storeFile file(key.storeFile)
                storePassword key.storePassword
                keyAlias key.keyAlias
                keyPassword key.keyPassword
            }
        }
        buildTypes {
            debug.signingConfig signingConfigs.fnative
            release.signingConfig signingConfigs.fnative
        }
    }

    // Prebuilt by tools/build-*.sh and staged by tools/build-apk.sh.
    packaging.jniLibs.useLegacyPackaging true

    // Not on Google Play; targetSdk 29 is deliberate.
    lint.disable 'ExpiredTargetSdkVersion'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // the game archive from factorio.com (.tar.xz), unpacked on the first start (FirstRun)
    implementation 'org.tukaani:xz:1.7'
}
